# Harness knowledge file. Update when architecture or workflow changes.
# Machine-readable summary of this repository for AI coding agents.

name: error-pages
module: github.com/tarampampam/error-pages
kind: [http-service, cli]
description: >
  Generates original HTTP error pages from a YAML config and HTML templates,
  served live by a fasthttp server (serve) or emitted as a static HTML tree
  (build). Shipped as a compiled binary and a distroless Docker image.

language:
  primary: go
  go_version: "1.18"          # go.mod; Docker builder golang:1.18.1-alpine
  secondary:
    - javascript               # l10n/l10n.js (browser-side localization, ESLint)

frameworks:
  - spf13/cobra                # CLI
  - valyala/fasthttp           # HTTP server
  - fasthttp/router            # routing
  - uber-go/zap                # structured logging (JSON optional)
  - prometheus/client_golang   # /metrics
  - gopkg.in/yaml.v3 + a8m/envsubst  # config parsing

entry_points:
  process: cmd/error-pages/main.go
  cli_tree: internal/cli/root.go        # NewCommand -> version | healthcheck | build | serve
  http_routes: internal/http/server.go  # Server.Register

commands:
  build: "go build -trimpath -ldflags \"-s -w -X github.com/tarampampam/error-pages/internal/version.version=$VERSION\" -o ./error-pages ./cmd/error-pages/"
  test: "go test -race ./..."
  lint: "golangci-lint run"             # CI pins golangci-lint v1.44, setup-go 1.17 for lint job
  int_test: "make int-test"             # Hurl suite against docker-compose 'web' service
  config_validate: "ajv validate --all-errors -s ./schemas/config/1.0.schema.json -d ./error-pages.y*ml"
  l10n_lint: "cd l10n && eslint ./*.js"
  docker_image: "make image"            # docker build -f Dockerfile -t error-pages:local .
  run_local: "make up"                  # docker-compose up web  -> http://127.0.0.1:8080

runtime:
  http_port_default: 8080
  listen_default: "0.0.0.0"
  endpoints:
    - "GET /                 -> index / default error page (honors X-Code header)"
    - "GET /{code}.html      -> error page for code, always HTTP 200"
    - "GET /version          -> build version"
    - "ANY /healthz          -> liveness (also /health/live, deprecated)"
    - "GET /metrics          -> Prometheus metrics"
  negotiation_headers: ["Content-Type", "X-Format"]   # json | xml, else HTML
  supported_formats: [html, json, xml]
  ingress_detail_headers:                # surfaced when --show-details / SHOW_DETAILS=true
    [X-Original-URI, X-Namespace, X-Ingress-Name, X-Service-Name, X-Service-Port, X-Request-ID, X-Forwarded-For, Host]

config:
  file: error-pages.yml
  schema: schemas/config/1.0.schema.json
  env_expansion: true                    # envsubst over the YAML
  env_vars:                              # names only; CLI flag > env var > default
    - LISTEN_ADDR
    - LISTEN_PORT
    - TEMPLATE_NAME
    - CONFIG_FILE
    - DEFAULT_ERROR_PAGE
    - DEFAULT_HTTP_CODE
    - SHOW_DETAILS
    - PROXY_HTTP_HEADERS
    - DISABLE_L10N

templates:
  dir: templates/
  selection_modes: [first, random, i-said-random, random-daily, random-hourly, "<explicit name>"]

ci:
  workflows:
    - .github/workflows/tests.yml         # gitleaks, golangci-lint, ajv, eslint, go test -race, build matrix, generator check, docker build+trivy+hurl
    - .github/workflows/release.yml       # cross-build binaries, multi-arch docker push, gh-pages demo
    - .github/workflows/documentation.yml
  coverage: codecov (.codecov.yml)

persistence: none                         # stateless; no database, cache is in-process only
messaging: none

confidence: HIGH   # derived from go.mod, Makefile, CI workflows, Dockerfile, source
